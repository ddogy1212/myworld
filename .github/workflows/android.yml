name: Build MYWORLD APK
on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile MYWORLD
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: myworld-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK in downloads folder
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/myworld-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/myworld-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish MYWORLD APK [skip ci]"
            git push
          fi
